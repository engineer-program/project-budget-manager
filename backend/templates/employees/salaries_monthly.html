{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>З/П сотрудников | Бюджетирование проектов ТКЗ</title>
    <link rel="stylesheet" href="{% static 'vendor/tabulator/tabulator.min.css' %}">
    <style>
        :root {
            --bg-top: #f5efe5;
            --bg-bottom: #dce6ef;
            --panel: rgba(255, 255, 255, 0.93);
            --panel-border: rgba(123, 95, 61, 0.16);
            --text-main: #21313d;
            --text-muted: #667786;
            --accent: #4ba7e9;
            --accent-hover: #3a86bc;
            --shadow: 0 24px 60px rgba(33, 49, 61, 0.14);
            --input-border: #d1d8de;
            --success-bg: #e9f7ef;
            --success-text: #22643e;
            --error-bg: #fbeaea;
            --error-text: #9c2f2f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(circle at top left, rgba(75, 167, 233, 0.12), transparent 34%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
        }

        .page {
            max-width: 1500px;
            margin: 0 auto;
            padding: 28px 24px 40px;
            position: relative;
        }

        .page-logo {
            position: absolute;
            top: 24px;
            left: 24px;
            width: 44px;
            height: 44px;
            object-fit: contain;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .topbar-actions,
        .filters,
        .table-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .topbar-actions {
            justify-content: flex-end;
            margin-left: auto;
        }

        .filters {
            justify-content: center;
            align-items: flex-end;
        }

        .table-actions {
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .back-link,
        .admin-link,
        .logout-button,
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(33, 49, 61, 0.08);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.78);
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .button.primary {
            color: #fff;
            background: var(--accent);
            border-color: var(--accent);
        }

        .back-link:hover,
        .admin-link:hover,
        .logout-button:hover,
        .button:hover {
            background: #fff;
            border-color: rgba(75, 167, 233, 0.3);
        }

        .button.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .button:disabled {
            opacity: 0.58;
            cursor: not-allowed;
        }

        .logout-form {
            margin: 0;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 30px 28px;
        }

        .panel + .panel {
            margin-top: 22px;
        }

        .heading {
            text-align: center;
            margin: 0 0 28px;
            font-size: 2rem;
            line-height: 1.15;
        }

        .field {
            min-width: 220px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .field select {
            width: 100%;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 1rem;
            background: #fff;
            color: var(--text-main);
        }

        .status-message {
            display: none;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }

        .status-message.visible {
            display: block;
        }

        .status-message.success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .status-message.error {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .table-panel {
            display: none;
        }

        .table-panel.visible {
            display: block;
        }

        .dirty-counter {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        #salary-table {
            border: 1px solid rgba(33, 49, 61, 0.08);
            border-radius: 8px;
            overflow: hidden;
        }

        .tabulator {
            background: transparent;
            border: 0;
            font-size: 0.94rem;
        }

        .tabulator .tabulator-header {
            background: #eff5f9;
            border-bottom: 1px solid rgba(33, 49, 61, 0.08);
        }

        .tabulator .tabulator-header .tabulator-col {
            background: #eff5f9;
            border-right: 1px solid rgba(33, 49, 61, 0.08);
        }

        .tabulator .tabulator-row.tabulator-row-even {
            background: rgba(75, 167, 233, 0.03);
        }

        .tabulator .tabulator-cell.dirty-cell {
            background: #fff4cf;
        }

        @media (max-width: 700px) {
            .page {
                padding: 20px 16px 32px;
            }

            .page-logo {
                top: 20px;
                left: 16px;
                width: 38px;
                height: 38px;
            }

            .topbar {
                flex-direction: column;
                align-items: stretch;
            }

            .topbar-actions {
                justify-content: flex-start;
                margin-left: 0;
            }

            .panel {
                padding: 24px 18px;
            }

            .heading {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <img class="page-logo" src="{% static 'images/company_logo.ico' %}" alt="Логотип компании">

        <div class="topbar">
            <a class="back-link" href="{% url 'home' %}">На главную</a>

            <div class="topbar-actions">
                {% if request.user.is_superuser or request.user.is_staff %}
                    <a class="admin-link" href="{% url 'admin:index' %}">Администрирование</a>
                {% endif %}
                <form class="logout-form" method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="logout-button" type="submit">Выйти</button>
                </form>
            </div>
        </div>

        <section class="panel">
            <h1 class="heading">Заработные месячные платы сотрудников</h1>

            <div id="status-message" class="status-message"></div>

            <div class="filters">
                <div class="field">
                    <label for="{{ form.month.id_for_label }}">Месяц</label>
                    {{ form.month }}
                </div>
                <div class="field">
                    <label for="{{ form.year.id_for_label }}">Год</label>
                    {{ form.year }}
                </div>
                <button id="load-table-button" class="button primary" type="button">
                    Получить список пользователей
                </button>
            </div>
        </section>

        <section id="table-panel" class="panel table-panel">
            <div class="table-actions">
                <span id="dirty-counter" class="dirty-counter">Изменений нет</span>
                <button id="save-table-button" class="button primary" type="button" disabled>
                    Сохранить
                </button>
            </div>
            <div id="salary-table"></div>
        </section>
    </div>

    <script src="{% static 'vendor/tabulator/tabulator.min.js' %}"></script>
    <script>
        const monthSelect = document.getElementById("{{ form.month.id_for_label }}");
        const yearSelect = document.getElementById("{{ form.year.id_for_label }}");
        const loadButton = document.getElementById("load-table-button");
        const saveButton = document.getElementById("save-table-button");
        const tablePanel = document.getElementById("table-panel");
        const statusMessage = document.getElementById("status-message");
        const dirtyCounter = document.getElementById("dirty-counter");
        const dirtyRows = new Map();
        let table = null;

        function getCsrfToken() {
            const cookie = document.cookie
                .split("; ")
                .find((item) => item.startsWith("csrftoken="));
            return cookie ? decodeURIComponent(cookie.split("=")[1]) : "";
        }

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message visible ${type}`;
        }

        function clearStatus() {
            statusMessage.textContent = "";
            statusMessage.className = "status-message";
        }

        function getPeriodParams() {
            return new URLSearchParams({
                month: monthSelect.value,
                year: yearSelect.value,
            });
        }

        function normalizeMoney(value) {
            if (value === null || value === undefined || value === "") {
                return "0.00";
            }
            const normalized = Number(String(value).replace(",", "."));
            if (Number.isNaN(normalized)) {
                return "0.00";
            }
            return normalized.toFixed(2);
        }

        function formatMoney(value) {
            return `${normalizeMoney(value)}₽`;
        }

        function updateDirtyCounter() {
            const count = dirtyRows.size;
            dirtyCounter.textContent = count === 0
                ? "Изменений нет"
                : `Изменено строк: ${count}`;
            saveButton.disabled = count === 0;
        }

        function markRowDirty(cell) {
            const row = cell.getRow();
            const rowData = row.getData();
            dirtyRows.set(rowData.employee_id, rowData);
            cell.getElement().classList.add("dirty-cell");
            updateDirtyCounter();
        }

        const moneyColumn = (title, field) => ({
            title,
            field,
            editor: "input",
            hozAlign: "right",
            headerFilter: "input",
            sorter: "number",
            mutatorEdit: normalizeMoney,
            formatter: (cell) => formatMoney(cell.getValue()),
            cellEdited: markRowDirty,
        });

        function buildTable(rows) {
            dirtyRows.clear();
            updateDirtyCounter();

            if (table) {
                table.replaceData(rows);
                return;
            }

            table = new Tabulator("#salary-table", {
                data: rows,
                index: "employee_id",
                layout: "fitDataStretch",
                height: "650px",
                movableColumns: true,
                columnDefaults: {
                    headerSort: true,
                    resizable: true,
                },
                columns: [
                    {title: "ФИО сотрудника", field: "full_name", frozen: true, width: 280, headerFilter: "input"},
                    {title: "Должность", field: "position", width: 220, headerFilter: "input"},
                    moneyColumn("Номинальная З/П", "base_salary"),
                    moneyColumn("Доп. З/П", "extra_salary"),
                    moneyColumn("Премия квартальная", "bonus"),
                    moneyColumn("Доп. премия", "extra_bonus"),
                    moneyColumn("Отпускные", "vacation"),
                    moneyColumn("Больничные", "sick_leave"),
                    moneyColumn("Командировочные", "business_trip"),
                ],
            });
        }

        async function loadTable() {
            clearStatus();
            loadButton.disabled = true;
            loadButton.textContent = "Загрузка...";

            try {
                const response = await fetch(`{% url 'employee-salaries-data' %}?${getPeriodParams()}`);
                const payload = await response.json();
                if (!response.ok || payload.status !== "ok") {
                    throw new Error(payload.message || "Не удалось загрузить данные.");
                }

                tablePanel.classList.add("visible");
                buildTable(payload.rows);
                showStatus("Список сотрудников загружен.", "success");
            } catch (error) {
                showStatus(error.message, "error");
            } finally {
                loadButton.disabled = false;
                loadButton.textContent = "Получить список пользователей";
            }
        }

        async function saveTable() {
            clearStatus();
            saveButton.disabled = true;
            saveButton.textContent = "Сохранение...";

            try {
                const rows = Array.from(dirtyRows.values());
                const response = await fetch("{% url 'employee-salaries-bulk-save' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCsrfToken(),
                    },
                    body: JSON.stringify({
                        month: monthSelect.value,
                        year: yearSelect.value,
                        rows,
                    }),
                });
                const payload = await response.json();
                if (!response.ok || payload.status !== "ok") {
                    throw new Error(payload.message || "Не удалось сохранить данные.");
                }

                dirtyRows.clear();
                document
                    .querySelectorAll(".dirty-cell")
                    .forEach((cell) => cell.classList.remove("dirty-cell"));
                updateDirtyCounter();
                showStatus(`Сохранено строк: ${payload.saved}.`, "success");
            } catch (error) {
                showStatus(error.message, "error");
                updateDirtyCounter();
            } finally {
                saveButton.textContent = "Сохранить";
            }
        }

        loadButton.addEventListener("click", loadTable);
        saveButton.addEventListener("click", saveTable);
        monthSelect.addEventListener("change", () => {
            tablePanel.classList.remove("visible");
            dirtyRows.clear();
            updateDirtyCounter();
            clearStatus();
        });
        yearSelect.addEventListener("change", () => {
            tablePanel.classList.remove("visible");
            dirtyRows.clear();
            updateDirtyCounter();
            clearStatus();
        });
    </script>
</body>
</html>
